services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENABLE_REVIEW: ${ENABLE_REVIEW:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    environment:
      API_UPSTREAM: http://api:8000
      # This server-side token is never included in the JS build.
      REVIEW_TOKEN: ${REVIEW_TOKEN:-}
      ENABLE_REVIEW: ${ENABLE_REVIEW:-false}
    restart: unless-stopped
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: energytool
      POSTGRES_DB: energytool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energytool-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "energytool", "-d", "energytool"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://energytool@db:5432/energytool}
      PGPASSWORD: ${POSTGRES_PASSWORD:-energytool-local}
      INDEX_DIR: /private/index
      REVIEW_TOKEN: ${REVIEW_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ML_TIMEOUT_SECONDS: ${ML_TIMEOUT_SECONDS:-10}
      TURN_LEASE_SECONDS: ${TURN_LEASE_SECONDS:-30}
      SYNC_WAIT_SECONDS: ${SYNC_WAIT_SECONDS:-0.5}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-120}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-32768}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      ALLOW_PRIVATE_CORPUS_TO_LLM: ${ALLOW_PRIVATE_CORPUS_TO_LLM:-}
      LLM_ALLOW_PRIVATE_CORPUS: ${LLM_ALLOW_PRIVATE_CORPUS:-false}
      LLM_ALLOW_INTERNAL_HTTP: ${LLM_ALLOW_INTERNAL_HTTP:-false}
      LLM_GENERATION_MODE: ${LLM_GENERATION_MODE:-grounded}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      BASE_URL: ${BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEN_MODEL: ${GEN_MODEL:-}
      TEMPERATURE: ${TEMPERATURE:-0}
      MAX_TOKENS: ${MAX_TOKENS:-2048}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      TOP_K: ${TOP_K:-6}
      RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-20}
      RRF_K: ${RRF_K:-60}
      LEXICAL_WEIGHT: ${LEXICAL_WEIGHT:-1}
      DENSE_WEIGHT: ${DENSE_WEIGHT:-1}
      RETRIEVAL_TIMEOUT_SECONDS: ${RETRIEVAL_TIMEOUT_SECONDS:-8}
      EMB_MODEL: ${EMB_MODEL:-baai/bge-m3}
      EMBEDDER_API_KEY: ${EMBEDDER_API_KEY:-}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/cache}
    volumes:
      - knowledge_index:/private/index:ro
      - embedding_cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      start_period: 150s
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  ingest:
    profiles: [tools]
    build: .
    command: [python, scripts/ingest.py, --corpus-dir, /corpus, --index-dir, /private/index]
    volumes:
      - knowledge_index:/private/index
      - type: bind
        source: ${CORPUS_DIR_HOST:-../files/corpus}
        target: /corpus
        read_only: true
volumes:
  postgres_data:
  knowledge_index:
  embedding_cache:
